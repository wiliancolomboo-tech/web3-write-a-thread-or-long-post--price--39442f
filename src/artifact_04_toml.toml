[package]
name = "sol_price_compare"
version = "0.1.0"
description = "Solana Price Comparison & Execution Verification Protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "sol_price_compare"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
pyth-sdk-solana = "0.10.1"