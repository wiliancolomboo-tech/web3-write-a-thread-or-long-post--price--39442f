[package]
name = "price_comparator_guard"
version = "0.1.0"
description = "Deterministic On-Chain Price Comparison Guard for Solana DeFi"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "price_comparator_guard"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "associated_token"] }
pyth-solana-receiver-sdk = "0.1.0"