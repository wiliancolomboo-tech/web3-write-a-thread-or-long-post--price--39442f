version: '3.8'

services:
  solprice-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solprice-lens-daemon
    restart: unless-stopped
    ports:
      - "9100:9100"
    environment:
      - PORT=9100
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - SAMPLE_TRADE_SIZE_SOL=50
      - ALERT_THRESHOLD_BPS=15
      - POLL_INTERVAL_MS=3000
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - RESEND_API_KEY=re_enterprise_test_123456789
      - ADMIN_ALERT_EMAIL=trading-desk@enterprise.com
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9100/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"