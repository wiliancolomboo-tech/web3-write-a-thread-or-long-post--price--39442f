version: "3.8"

services:
  solana-price-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solana-price-sentinel
    restart: always
    environment:
      - SOLANA_RPC_URL=${SOLANA_RPC_URL}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ALERT_EMAIL_RECIPIENT=${ALERT_EMAIL_RECIPIENT}
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"