# File: docker-compose.yml
version: '3.8'

services:
  solprice-lens:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solprice-lens-daemon
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - PYTH_SERVICE_URL=https://hermes.pyth.network
      - JUPITER_API_URL=https://quote-api.jup.ag/v6
      - DEVIATION_THRESHOLD_BPS=25
      - PRIORITY_FEE_MICRO_LAMPORTS=50000
      - ENTERPRISE_WEBHOOK_URL=${ENTERPRISE_WEBHOOK_URL:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"