version: '3.8'

services:
  sol-price-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sol-price-engine
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - RESEND_API_KEY=re_123456789abcdef
      - AUDIT_EMAIL=admin@institution.fi
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"