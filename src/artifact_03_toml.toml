[package]
name = "solana-price-comparator"
version = "0.1.0"
description = "Deterministic On-Chain Price Comparison and Oracle Guard Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_price_comparator"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
pyth-sdk-solana = "0.10.3"