[package]
name = "solprism-guard"
version = "0.1.0"
description = "SolPrism On-Chain Comparative Price Verification Engine"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solprism_guard"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1" }
solana-program = "1.18.26"